  <meta charset="utf-8">

  <title>问答3</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f2f2f2;
    }

    body {
      display: grid;
      place-items: start center;
      perspective: 1200px;
      overflow: hidden;
    }

    .frame {
      position: relative;
      width: 375px;
      height: 812px;
      overflow: hidden;
      background: #fff;
      transform-origin: center;
    }

    .frame.is-turning {
      animation: page-turn 1s cubic-bezier(0.55, 0.02, 0.34, 1) forwards;
      pointer-events: none;
    }

    @keyframes page-turn {
      0% {
        opacity: 1;
        filter: blur(0);
        transform: translateX(0) rotateY(0deg) scale(1);
      }

      45% {
        opacity: 0.92;
        filter: blur(0.6px) brightness(1.08);
        transform: translateX(-7%) rotateY(-18deg) scale(0.985);
      }

      100% {
        opacity: 0;
        filter: blur(5px) brightness(0.8);
        transform: translateX(-105%) rotateY(-42deg) scale(0.94);
      }
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .top-home-link {
      position: absolute;
      left: 2.8%;
      top: 5.5%;
      width: 11%;
      height: 6.5%;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 16;
    }

    .top-home-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .back-link {
      position: absolute;
      left: 3.5%;
      top: 89.7%;
      width: 16%;
      height: 8%;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .back-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .next-link {
      position: absolute;
      left: 80.5%;
      top: 89.7%;
      width: 16%;
      height: 8%;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .next-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .answer-option {
      position: absolute;
      display: block;
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      z-index: 12;
      -webkit-tap-highlight-color: transparent;
    }

    .answer-option.is-selected {
      background: #ffd84d;
      mix-blend-mode: multiply;
    }

    .answer-option:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .answer-a { left: 212px; top: 267px; width: 138px; height: 32px; }
    .answer-b { left: 53px; top: 338px; width: 154px; height: 32px; }
    .answer-c { left: 181px; top: 423px; width: 152px; height: 32px; }
    .answer-d { left: 49px; top: 490px; width: 152px; height: 32px; }

    @media (max-width: 374px) {
      .frame {
        width: 100vw;
        height: calc(100vw * 812 / 375);
      }
    }
  </style>
  <script>
(() => {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  const storageKey = 'loveQuizAmbientMusic';
  const step = 0.56;
  const phrase = [
    { note: 523.25, length: 1.5 },
    { note: 659.25, length: 1 },
    { note: 783.99, length: 2 },
    { note: null, length: 1 },
    { note: 698.46, length: 1.5 },
    { note: 659.25, length: 1 },
    { note: 587.33, length: 2 },
    { note: null, length: 1 },
    { note: 493.88, length: 1.5 },
    { note: 587.33, length: 1 },
    { note: 659.25, length: 2 },
    { note: null, length: 1 },
    { note: 523.25, length: 1 },
    { note: 587.33, length: 1 },
    { note: 523.25, length: 2.5 },
    { note: null, length: 1.5 }
  ];
  let context;
  let master;
  let timer;
  let nextTime = 0;
  let phraseIndex = 0;
  let started = false;

  function softTone(frequency, time, duration, volume, type = 'sine') {
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    const filter = context.createBiquadFilter();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, time);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1250, time);
    filter.Q.value = 0.25;

    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(volume, time + 0.08);
    gain.gain.exponentialRampToValueAtTime(volume * 0.45, time + duration * 0.55);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

    oscillator.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    oscillator.start(time);
    oscillator.stop(time + duration + 0.08);
  }

  function schedule() {
    while (nextTime < context.currentTime + 0.3) {
      const item = phrase[phraseIndex % phrase.length];

      if (item.note) {
        softTone(item.note, nextTime, step * item.length * 0.88, 0.095, 'triangle');
        softTone(item.note * 2, nextTime + 0.035, step * 0.7, 0.012, 'sine');
      }

      nextTime += step * item.length;
      phraseIndex = (phraseIndex + 1) % phrase.length;
    }
  }

  async function startMusic() {
    if (started) {
      if (context.state === 'suspended') await context.resume();
      return;
    }

    context = new AudioContextClass();
    master = context.createGain();
    master.gain.setValueAtTime(0.0001, context.currentTime);
    master.gain.exponentialRampToValueAtTime(0.075, context.currentTime + 1.8);
    master.connect(context.destination);

    nextTime = context.currentTime + 0.08;
    schedule();
    timer = window.setInterval(schedule, 100);
    started = true;
    sessionStorage.setItem(storageKey, 'on');
    await context.resume();
  }

  const activate = () => startMusic().catch(() => {});

  window.addEventListener('pointerdown', activate, { passive: true, once: true });
  window.addEventListener('keydown', activate, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sessionStorage.getItem(storageKey) === 'on') activate();
  });
  window.addEventListener('pagehide', () => {
    if (timer) window.clearInterval(timer);
  });

  if (sessionStorage.getItem(storageKey) === 'on') activate();
})();

</script>

    <button class="answer-option answer-a" data-choice="A" type="button" aria-label="选择答案 A"></button>
    <button class="answer-option answer-b" data-choice="B" type="button" aria-label="选择答案 B"></button>
    <button class="answer-option answer-c" data-choice="C" type="button" aria-label="选择答案 C"></button>
    <button class="answer-option answer-d" data-choice="D" type="button" aria-label="选择答案 D"></button>
  </main>
  <script>
(function () {
  const storageKey = 'love-food-quiz-answers';

  // 六种结果分别代表不同的饭搭子倾向。逐题权重反映具体语境，
  // 整体选项占比则用于强化用户在六道题中反复表现出的选择倾向。
  const choiceAffinity = {
    A: [0, 1, 0, 0, 2, 2],
    B: [2, 1, 1, 0, 0, 2],
    C: [0, 0, 3, 0, 0, 0],
    D: [0, 0, 0, 2, 2, 0]
  };

  const scoreMap = {
    1: {
      A: [0, 0, 0, 0, 1, 3],
      B: [1, 2, 1, 0, 0, 0],
      C: [0, 0, 3, 0, 0, 0],
      D: [0, 0, 0, 1, 3, 0]
    },
    2: {
      A: [0, 2, 0, 3, 0, 0],
      B: [3, 0, 0, 0, 0, 1],
      C: [0, 0, 3, 0, 0, 0],
      D: [2, 0, 0, 0, 3, 0]
    },
    3: {
      A: [0, 0, 0, 0, 3, 1],
      B: [0, 0, 3, 0, 0, 0],
      C: [0, 1, 2, 0, 0, 0],
      D: [0, 2, 0, 3, 0, 0]
    },
    4: {
      A: [0, 0, 0, 0, 1, 3],
      B: [2, 0, 0, 0, 0, 1],
      C: [0, 0, 3, 0, 0, 0],
      D: [0, 0, 0, 3, 1, 0]
    },
    5: {
      A: [2, 0, 0, 0, 3, 0],
      B: [0, 3, 1, 0, 0, 0],
      C: [0, 0, 3, 0, 0, 0],
      D: [0, 0, 0, 0, 3, 0]
    },
    6: {
      A: [0, 2, 3, 0, 0, 0],
      B: [1, 0, 0, 0, 0, 3],
      C: [0, 0, 3, 0, 1, 0],
      D: [0, 0, 0, 1, 3, 0]
    }
  };

  function readAnswers() {
    try {
      return JSON.parse(sessionStorage.getItem(storageKey)) || {};
    } catch (_) {
      return {};
    }
  }

  function writeAnswers(answers) {
    sessionStorage.setItem(storageKey, JSON.stringify(answers));
  }

  window.resetQuizAnswers = function () {
    sessionStorage.removeItem(storageKey);
  };

  window.recordQuizAnswer = function (question, choice) {
    if (!scoreMap[question] || !scoreMap[question][choice]) return;
    const answers = readAnswers();
    answers[question] = choice;
    writeAnswers(answers);
  };

  window.getQuizChoiceCounts = function () {
    const answers = readAnswers();
    return Object.values(answers).reduce((counts, choice) => {
      if (Object.prototype.hasOwnProperty.call(counts, choice)) {
        counts[choice] += 1;
      }
      return counts;
    }, { A: 0, B: 0, C: 0, D: 0 });
  };

  window.getQuizResult = function () {
    const answers = readAnswers();
    const scores = [0, 0, 0, 0, 0, 0];

    Object.keys(answers).forEach((question) => {
      const choice = answers[question];
      const weights = scoreMap[question] && scoreMap[question][choice];
      if (!weights) return;
      weights.forEach((weight, index) => {
        scores[index] += weight;
      });
    });

    const choiceCounts = window.getQuizChoiceCounts();
    const answerTotal = Object.values(choiceCounts).reduce((sum, count) => sum + count, 0);

    if (answerTotal > 0) {
      Object.keys(choiceCounts).forEach((choice) => {
        const proportion = choiceCounts[choice] / answerTotal;
        choiceAffinity[choice].forEach((affinity, index) => {
          scores[index] += proportion * affinity * 2;
        });
      });
    }

    const highest = Math.max(...scores);
    const finalists = scores
      .map((score, index) => ({ score, result: index + 1 }))
      .filter((item) => item.score === highest);

    if (finalists.length === 1) return finalists[0].result;

    const lastChoicePreference = { A: 2, B: 6, C: 3, D: 5 };
    const preferredResult = lastChoicePreference[answers[6]];
    const preferredFinalist = finalists.find((item) => item.result === preferredResult);
    return preferredFinalist ? preferredFinalist.result : finalists[0].result;
  };

  const params = new URLSearchParams(window.location.search);
  if (params.get('new') === '1') {
    window.resetQuizAnswers();
  }
})();

</script>
  <script>
    const answerOptions = document.querySelectorAll('.answer-option');
    const pageFrame = document.querySelector('.frame');
    let isNavigating = false;

    answerOptions.forEach((option) => {
      option.addEventListener('click', () => {
        if (isNavigating) return;

        isNavigating = true;
        recordQuizAnswer(3, option.dataset.choice);
        option.classList.add('is-selected');
        answerOptions.forEach((item) => {
          item.disabled = true;
        });

        window.setTimeout(() => {
          pageFrame.classList.add('is-turning');
          window.setTimeout(() => {
            window.location.href = 'quiz4.html';
          }, 1000);
        }, 1000);
      });
    });
  </script>
</body>
