<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Frame 1</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f2f2f2;
    }

    body {
      display: grid;
      place-items: start center;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .frame {
      position: relative;
      width: 375px;
      height: 812px;
      overflow: hidden;
      background: #fff;
    }

    .cover {
      display: block;
      width: 375px;
      height: 812px;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .wink-eye {
      position: absolute;
      left: 109px;
      top: 337px;
      width: 14px;
      height: 24px;
      border-radius: 8px;
      background: #f8497f;
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      animation: eye-wink 3.2s ease-in-out infinite;
    }

    .wink-eye::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 7px;
      width: 9px;
      height: 9px;
      border-right: 3px solid #2b1020;
      border-bottom: 3px solid #2b1020;
      border-radius: 1px;
      transform: rotate(-45deg);
    }

    @keyframes eye-wink {
      0%, 42%, 56%, 100% {
        opacity: 0;
      }

      46%, 52% {
        opacity: 1;
      }
    }

    .label-cleanup {
      position: absolute;
      left: 55%;
      top: 23.8%;
      width: 26.5%;
      height: 9.2%;
      background: linear-gradient(110deg, #feb9e7 0%, #febbe8 52%, #febeea 100%);
      transform: rotate(-20deg);
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 84%, transparent 100%);
      mask-image: radial-gradient(ellipse at center, #000 84%, transparent 100%);
    }

    .exact-glyph {
      position: absolute;
      pointer-events: none;
      animation: exact-glyph-hop 1.92s ease-in-out infinite;
      animation-delay: 0s;
      will-change: transform;
    }

    .exact-glyph img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes exact-glyph-hop {
      0%, 35%, 100% {
        transform: translateY(0);
      }

      15% {
        transform: translateY(-6px);
      }

      25% {
        transform: translateY(1px);
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .exact-glyph {
        animation: none;
      }

      .wink-eye {
        animation: none;
        opacity: 0;
      }
    }

    .question-link {
      position: absolute;
      left: 8.5%;
      top: 76.72%;
      width: 83%;
      height: 7.52%;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .question-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 3px;
    }

    @media (max-width: 374px) {
      .frame {
        width: 100vw;
        height: calc(100vw * 812 / 375);
      }

      .cover {
        width: 100%;
        height: 100%;
      }
    }
  </style>
  <script>
(() => {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  const storageKey = 'loveQuizAmbientMusic';
  const step = 0.56;
  const phrase = [
    { note: 523.25, length: 1.5 },
    { note: 659.25, length: 1 },
    { note: 783.99, length: 2 },
    { note: null, length: 1 },
    { note: 698.46, length: 1.5 },
    { note: 659.25, length: 1 },
    { note: 587.33, length: 2 },
    { note: null, length: 1 },
    { note: 493.88, length: 1.5 },
    { note: 587.33, length: 1 },
    { note: 659.25, length: 2 },
    { note: null, length: 1 },
    { note: 523.25, length: 1 },
    { note: 587.33, length: 1 },
    { note: 523.25, length: 2.5 },
    { note: null, length: 1.5 }
  ];
  let context;
  let master;
  let timer;
  let nextTime = 0;
  let phraseIndex = 0;
  let started = false;

  function softTone(frequency, time, duration, volume, type = 'sine') {
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    const filter = context.createBiquadFilter();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, time);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1250, time);
    filter.Q.value = 0.25;

    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(volume, time + 0.08);
    gain.gain.exponentialRampToValueAtTime(volume * 0.45, time + duration * 0.55);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

    oscillator.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    oscillator.start(time);
    oscillator.stop(time + duration + 0.08);
  }

  function schedule() {
    while (nextTime < context.currentTime + 0.3) {
      const item = phrase[phraseIndex % phrase.length];

      if (item.note) {
        softTone(item.note, nextTime, step * item.length * 0.88, 0.095, 'triangle');
        softTone(item.note * 2, nextTime + 0.035, step * 0.7, 0.012, 'sine');
      }

      nextTime += step * item.length;
      phraseIndex = (phraseIndex + 1) % phrase.length;
    }
  }

  async function startMusic() {
    if (started) {
      if (context.state === 'suspended') await context.resume();
      return;
    }

    context = new AudioContextClass();
    master = context.createGain();
    master.gain.setValueAtTime(0.0001, context.currentTime);
    master.gain.exponentialRampToValueAtTime(0.075, context.currentTime + 1.8);
    master.connect(context.destination);

    nextTime = context.currentTime + 0.08;
    schedule();
    timer = window.setInterval(schedule, 100);
    started = true;
    sessionStorage.setItem(storageKey, 'on');
    await context.resume();
  }

  const activate = () => startMusic().catch(() => {});

  window.addEventListener('pointerdown', activate, { passive: true, once: true });
  window.addEventListener('keydown', activate, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && sessionStorage.getItem(storageKey) === 'on') activate();
  });
  window.addEventListener('pagehide', () => {
    if (timer) window.clearInterval(timer);
  });

  if (sessionStorage.getItem(storageKey) === 'on') activate();
})();

</script>
